<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOUZPA · Who's party? Ma houz party.</title>
<meta name="theme-color" content="#0A0A0C">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<style>
:root{--bg:#15112B;--card:#1F1A3D;--line:#332C5E;--txt:#F4F1FF;--mut:#B9B2DA;--amber:#FFB547;--pink:#FF4F9A;--cyan:#3DE8FF;--ok:#4ADE80;--warn:#FBBF24}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
/* moving party glow behind the app */
body::before{content:"";position:fixed;inset:-30%;z-index:-1;background:
  radial-gradient(circle at 20% 30%,rgba(255,79,154,.22),transparent 35%),
  radial-gradient(circle at 80% 20%,rgba(255,181,71,.16),transparent 35%),
  radial-gradient(circle at 60% 80%,rgba(61,232,255,.14),transparent 40%);
  animation:glow 14s ease-in-out infinite alternate}
@keyframes glow{to{transform:rotate(25deg) scale(1.15)}}
main{max-width:460px;margin:0 auto;padding:20px 16px 110px;min-height:100vh;animation:rise .5s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.center{display:flex;flex-direction:column;justify-content:center;gap:16px}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:44px;letter-spacing:1px;line-height:1}
.logo.sm{font-size:26px}
.logo .h{color:var(--amber)}.logo .z{color:#fff;display:inline-block}.logo .p{color:var(--pink)}
.logo .z{animation:zbeat 1.6s ease-in-out infinite}
@keyframes zbeat{0%,100%{transform:scale(1)}10%{transform:scale(1.18) rotate(-6deg);text-shadow:0 0 18px var(--pink)}}
.tag{color:var(--mut);font-size:16px}
.card{background:rgba(31,26,61,.85);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(6px)}
label{font-size:13px;color:var(--mut);font-weight:500}
input{width:100%;background:#120E26;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px;font:inherit;outline:none}
input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,181,71,.15)}
.btn{background:linear-gradient(90deg,var(--pink),#FF7A59);color:#fff;border:0;border-radius:12px;padding:13px 16px;font:600 15px Inter,sans-serif;cursor:pointer;min-height:46px;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.6}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.msg{font-size:14px;color:var(--amber);min-height:20px}
.err{color:#FF8A8A}
.small{font-size:13px;color:var(--mut)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.hbtns{display:flex;gap:8px}
.icon-btn{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:12px;min-width:46px;min-height:46px;font-size:18px;cursor:pointer}
.banner{background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);color:#FDE68A;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px}
h2{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:6px 0 10px}
.party{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px;opacity:0;animation:rise .45s ease-out forwards}
.party .cover{height:130px;background:linear-gradient(135deg,#3A2F6B,#15112B);display:flex;align-items:flex-end;padding:10px}
.party .cover img{width:100%;height:100%;object-fit:cover}
.party .body{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.party h3{font-size:16px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:3px 9px;color:var(--mut)}
.chip.alc{border-color:var(--amber);color:var(--amber)}
.price{font-weight:600;color:var(--amber)}
.empty{text-align:center;color:var(--mut);padding:40px 12px}
select,textarea{width:100%;background:#120E26;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px;font:inherit;outline:none}
textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{background:#120E26;border:1px solid var(--line);color:var(--txt);border-radius:99px;padding:8px 12px;font:500 13px Inter,sans-serif;cursor:pointer}
.pick.on{background:var(--pink);border-color:var(--pink);color:#fff}
.pick:disabled{opacity:.45}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border:0}
.okbox{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.4);color:#BBF7D0;border-radius:12px;padding:10px 12px;font-size:14px}
.tier{display:grid;grid-template-columns:1.4fr 1fr .8fr auto;gap:6px;align-items:center}
.x{background:none;border:0;color:#FF8A8A;font-size:20px;cursor:pointer;padding:0 6px}
.nav{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.nav .btn{flex:1;padding:10px;min-height:40px;font-size:14px}
.status{font-size:12px;border-radius:99px;padding:3px 9px;font-weight:600}
.st-pending_review{background:rgba(251,191,36,.15);color:#FDE68A}
.st-published{background:rgba(74,222,128,.15);color:#BBF7D0}
.st-cancelled,.st-draft{background:rgba(255,138,138,.12);color:#FFB4B4}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--mut)}
.check input{width:auto;margin-top:3px}
.sos{position:fixed;right:16px;bottom:20px;background:#E11D48;color:#fff;font-weight:700;text-decoration:none;border-radius:99px;padding:14px 20px;box-shadow:0 4px 18px rgba(225,29,72,.45);z-index:5}

/* ===== PARTY MODE SPLASH ===== */
#splash{position:fixed;inset:0;z-index:50;background:#0B0820;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;overflow:hidden;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash .beam{position:absolute;bottom:-10%;width:40vmax;height:120vmax;transform-origin:bottom center;opacity:.35;filter:blur(2px);
  background:linear-gradient(to top,var(--c),transparent 70%);clip-path:polygon(46% 100%,54% 100%,100% 0,0 0)}
#splash .b1{--c:var(--pink);left:5%;animation:sweepL 2.4s ease-in-out infinite alternate}
#splash .b2{--c:var(--amber);right:5%;animation:sweepR 2.1s ease-in-out infinite alternate}
#splash .b3{--c:var(--cyan);left:35%;animation:sweepL 2.8s ease-in-out infinite alternate-reverse}
@keyframes sweepL{from{transform:rotate(-28deg)}to{transform:rotate(18deg)}}
@keyframes sweepR{from{transform:rotate(28deg)}to{transform:rotate(-18deg)}}
#splash .big{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:64px;line-height:1;position:relative;z-index:2;text-shadow:0 3px 0 #0B0820,0 0 14px rgba(11,8,32,.8)}
#splash .big .z{display:inline-block}
/* neon sign: the Z's top bar (roof over HOU) and bottom bar (floor under PA) stretch with the beat */
#splash .big.sign{width:min(92vw,520px);text-shadow:none;animation:signIn .45s cubic-bezier(.2,1.4,.4,1) both}
#splash .big.sign svg{width:100%;height:auto;display:block;overflow:visible}
#splash .sign .frame{fill:rgba(11,8,32,.55);stroke:var(--pink);stroke-width:5;filter:drop-shadow(0 0 10px rgba(255,79,154,.8))}
#splash .sign text{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:86px}
#splash .sign .hou{fill:var(--amber);filter:drop-shadow(0 0 9px rgba(255,181,71,.75))}
#splash .sign .pa{fill:var(--pink);filter:drop-shadow(0 0 9px rgba(255,79,154,.85))}
#splash .sign .zline{fill:rgba(255,255,255,.06);stroke:#fff;stroke-width:5;stroke-linejoin:round;filter:drop-shadow(0 0 12px rgba(255,255,255,.7))}
@keyframes signIn{from{transform:scale(.35)}to{transform:scale(1)}}
#splash .sub{position:relative;z-index:2;color:var(--mut);font-size:15px;text-align:center;padding:0 24px}
#goParty{position:relative;z-index:2;font-size:18px;padding:16px 28px;border-radius:99px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,79,154,.6)}50%{box-shadow:0 0 0 18px rgba(255,79,154,0)}}
#skip{position:absolute;bottom:28px;z-index:2;background:none;border:0;color:var(--mut);font:500 14px Inter,sans-serif;text-decoration:underline;cursor:pointer}
#splash{transition:opacity .5s,background-color .12s}
@keyframes slam{from{transform:scale(2.2);text-shadow:0 0 40px #fff}to{transform:scale(1)}}
@keyframes shake{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-2px)}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
#onair{position:relative;z-index:2;font:700 13px 'Space Grotesk',sans-serif;letter-spacing:3px;color:#0B0820;background:var(--amber);padding:6px 14px;border-radius:6px;opacity:0;transition:opacity .3s}
@keyframes popin{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.confetti{position:fixed;top:-20px;width:9px;height:14px;z-index:55;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}.party{opacity:1}#onair{opacity:1}}
/* ================= HOUZPA APP LOOK: onyx black + gold + magenta ================= */
:root{--bg:#0A0A0C;--card:#141418;--card2:#1B1B21;--line:#2A2A31;--txt:#F7F3EA;--mut:#A39E93;
  --amber:#F2C46D;--gold1:#F8DC9B;--gold2:#C8902E;--pink:#E5195E;--ok:#4ADE80;--warn:#F2C46D}
body{background:var(--bg)}
body::before{background:
  radial-gradient(circle at 15% 10%,rgba(229,25,94,.16),transparent 35%),
  radial-gradient(circle at 90% 30%,rgba(242,196,109,.12),transparent 38%)}
.btn{background:linear-gradient(135deg,var(--pink),#FF4D7E);box-shadow:0 6px 20px rgba(229,25,94,.3)}
.btn.gold,#goParty{background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#1A1206;box-shadow:0 6px 22px rgba(242,196,109,.3)}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border-color:var(--line);border-radius:20px}
.card h3{font-family:'Unbounded',sans-serif;font-size:14px;letter-spacing:.3px;color:var(--gold1)}
input,select,textarea{background:#0F0F13;border-color:var(--line)}
input:focus,select:focus,textarea:focus{border-color:var(--amber)}
.pick.on{background:linear-gradient(135deg,var(--gold1),var(--gold2));border-color:transparent;color:#1A1206}
.okbox{background:rgba(242,196,109,.08);border-color:rgba(242,196,109,.35);color:var(--gold1)}
.banner{background:rgba(229,25,94,.1);border-color:rgba(229,25,94,.4);color:#FFC2D6;border-radius:14px}
.logo .h{color:var(--amber)}.logo .p{color:var(--pink)}
h2{font-family:'Unbounded',sans-serif;font-size:17px}

/* shell */
.shell{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(10,10,12,.78);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.05);max-width:520px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px}
.brand img{width:34px;height:34px;border-radius:10px;box-shadow:0 0 14px rgba(242,196,109,.35)}
.brand .word{font-family:'Unbounded',sans-serif;font-size:18px;letter-spacing:.5px}
.brand .h{color:var(--amber)}.brand .z{color:#fff}.brand .p{color:var(--pink)}
.sos-pill{background:#E11D48;color:#fff;font:800 12px 'Unbounded',sans-serif;letter-spacing:1px;text-decoration:none;border-radius:99px;padding:8px 13px;box-shadow:0 0 0 3px rgba(225,29,72,.2)}
main.page{max-width:520px;padding:6px 16px calc(110px + env(safe-area-inset-bottom));min-height:auto}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:100%;max-width:520px;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
  padding:8px 6px calc(10px + env(safe-area-inset-bottom));background:rgba(14,14,17,.92);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.06)}
.tab{background:none;border:0;color:#7D786E;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 10.5px Inter,sans-serif;cursor:pointer;padding:4px 0;min-height:48px;justify-content:center}
.tab svg,.fab svg,.city svg,.me svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--amber)}
.tab.on svg{filter:drop-shadow(0 0 6px rgba(242,196,109,.6))}
.ghosttab{pointer-events:none}
.fab{justify-self:center;width:60px;height:60px;margin-top:-30px;border-radius:20px;border:3px solid var(--bg);cursor:pointer;color:#1A1206;
  background:linear-gradient(135deg,var(--gold1),var(--gold2));box-shadow:0 8px 24px rgba(242,196,109,.45);display:grid;place-items:center;transition:transform .15s}
.fab svg{width:28px;height:28px;stroke-width:2.6}
.fab:active{transform:scale(.9) rotate(90deg)}
.fab.locked{filter:grayscale(.6) brightness(.7)}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:#F7F3EA;color:#111;padding:11px 16px;border-radius:14px;font:600 13px Inter,sans-serif;opacity:0;transition:.3s;z-index:70;width:max-content;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* home */
.hero{padding:14px 2px 6px}
.eyebrow{color:var(--mut);font-size:14px}
.hero h1{font-family:'Unbounded',sans-serif;font-weight:800;font-size:32px;line-height:1.08;margin:6px 0 12px;letter-spacing:-.5px}
.gold{background:linear-gradient(135deg,var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.city{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:7px 13px 7px 9px;font-size:13px;font-weight:600;margin-bottom:12px}
.city svg{width:16px;height:16px;color:var(--pink)}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin:0 -16px;padding-left:16px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.fchip{flex:none;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:99px;padding:9px 15px;font:600 13px Inter,sans-serif;cursor:pointer}
.fchip.on{background:var(--txt);color:#0A0A0C;border-color:var(--txt)}
.sec{display:flex;align-items:center;gap:8px;margin:14px 0 10px}
.count{font:700 11px Inter,sans-serif;background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:99px;padding:2px 8px}
.carousel{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:14px;opacity:0;animation:rise .45s ease-out forwards;transition:transform .15s}
.pcard:active{transform:scale(.98)}
.pcard.big{flex:none;width:80%;scroll-snap-align:start;margin-bottom:0}
.pcover{position:relative;height:190px;display:flex;align-items:flex-end}
.pcard.big .pcover{height:250px}
.emo{position:absolute;right:18px;top:40%;transform:translateY(-50%);font-size:64px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(5,5,7,.92))}
.datebox{position:absolute;left:12px;top:12px;z-index:2;background:rgba(10,10,12,.7);backdrop-filter:blur(8px);border:1px solid rgba(242,196,109,.4);border-radius:12px;padding:5px 9px;text-align:center;line-height:1}
.datebox b{display:block;font:800 18px 'Unbounded',sans-serif;color:var(--gold1)}
.datebox span{font:700 9.5px Inter,sans-serif;letter-spacing:1px;color:var(--mut)}
.hot{position:absolute;right:12px;top:12px;z-index:2;background:var(--pink);color:#fff;font:700 11px Inter,sans-serif;border-radius:99px;padding:5px 10px}
.ptitle{position:relative;z-index:2;padding:14px}
.ptitle h3{font:800 17px/1.2 'Unbounded',sans-serif;letter-spacing:-.2px}
.ptitle p{color:#D9D3C7;font-size:13px;margin-top:4px}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 14px;font-size:13px;color:var(--mut)}
.pfoot em{font-style:normal}.alc{color:var(--amber)}
.from{color:var(--txt)}.from b{font:800 16px 'Unbounded',sans-serif;color:var(--gold1)}
.skel{height:200px;border-radius:22px;margin-bottom:14px;background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.emptybox{text-align:center;background:linear-gradient(180deg,var(--card2),var(--card));border:1px dashed rgba(242,196,109,.35);border-radius:22px;padding:30px 20px;display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:6px}
.emptybox .big{font-size:56px;animation:zbeat 1.6s ease-in-out infinite}
.emptybox h3{font:800 16px 'Unbounded',sans-serif}

/* old list cards (Meri parties) */
.party{background:var(--card);border-color:var(--line);border-radius:20px}
.st-published{background:rgba(74,222,128,.14);color:#BBF7D0}
.st-pending_review{background:rgba(242,196,109,.15);color:var(--gold1)}

/* profile */
.me{text-align:center;padding:22px 0 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.avatar{width:86px;height:86px;border-radius:28px;display:grid;place-items:center;font:800 30px 'Unbounded',sans-serif;color:#1A1206;background:linear-gradient(135deg,var(--gold1),var(--gold2));box-shadow:0 10px 30px rgba(242,196,109,.35);margin-bottom:6px}
.me h1{font:800 22px 'Unbounded',sans-serif}
.me .small svg{width:14px;height:14px;vertical-align:-2px}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.badge{font:700 11.5px Inter,sans-serif;border-radius:99px;padding:5px 11px;background:var(--card2);border:1px solid var(--line)}
.badge.ok{color:#BBF7D0;border-color:rgba(74,222,128,.4)}.badge.warn{color:#FFC2D6;border-color:rgba(229,25,94,.4)}.badge.gold{color:var(--gold1);border-color:rgba(242,196,109,.5)}
.list{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:14px 0}
.li{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);color:var(--txt);font:500 15px Inter,sans-serif;padding:16px;cursor:pointer;text-decoration:none;text-align:left}
.li:last-child{border:0}.li.danger{color:#FF8A8A}
.center-t{text-align:center}
.pick{background:#0F0F13;border-color:var(--line)}
.carousel{scroll-padding-left:16px}
.carousel::after{content:"";flex:0 0 4px}
</style>
</head>
<body>
<!-- PARTY MODE SPLASH: sound needs one tap (phone browsers block auto-play) -->
<div id="splash" role="dialog" aria-label="HOUZPA party mode">
  <div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div>
  <div class="big sign">
    <svg viewBox="0 0 600 260" role="img" aria-label="HOUZPA">
      <rect class="frame" x="12" y="12" width="576" height="236" rx="32"></rect>
      <text class="hou" x="34" y="166">HOU</text>
      <path id="zpath" class="zline" d=""></path>
      <text class="pa" x="372" y="166">PA</text>
    </svg>
  </div>
  <div id="onair">PARTY MODE ON</div>
  <p class="sub">Who's party? Ma houz party.</p>
  <button class="btn" id="goParty" type="button">🔊 Party mode ON karo</button>
  <button id="skip" type="button">Bina awaaz ke aage badho</button>
</div>
<div id="flash"></div>

<div id="app"><main class="center"><div class="logo"><span class="h">HOU</span><span class="z">Z</span><span class="p">PA</span></div><p class="tag">Loading…</p></main></div>

<script>
// ===== PARTY MODE: original stadium-style intro, made in code (no copyrighted music) =====
(function(){
  const splash = document.getElementById('splash');
  const BEAT = .42;
  const BEATS = Array.from({length: 28}, (_, i) => i * BEAT);   // 28 dhoom-dhoom beats (~11.8s)
  const BUILD_START = 8.4;                                      // build-up starts while beats go on
  const DROPS = [13.6, 15.3, 17.0];                             // three drops
  const END = 18.6;
  const store = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} } };
  window.houzpaMuted = () => store.get('houzpa_muted') === '1';
  window.houzpaSetMuted = m => store.set('houzpa_muted', m ? '1' : '0');
  let ac = null, timers = [];
  const later = (sec, fn) => timers.push(setTimeout(fn, sec * 1000));

  function noiseBuf(len, pow){
    const b = ac.createBuffer(1, Math.max(1, ac.sampleRate*len), ac.sampleRate), d = b.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, pow);
    return b;
  }
  function kick(t, out){
    const o = ac.createOscillator(), g = ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(160,t); o.frequency.exponentialRampToValueAtTime(40,t+.18);
    g.gain.setValueAtTime(1,t); g.gain.exponentialRampToValueAtTime(.001,t+.3);
    o.connect(g).connect(out); o.start(t); o.stop(t+.32);
  }
  function clap(t, out, vol){
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf(.12, 4); f.type='bandpass'; f.frequency.value=1500; g.gain.value=vol;
    s.connect(f).connect(g).connect(out); s.start(t);
  }
  function snare(t, out, vol){
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf(.09, 3); f.type='highpass'; f.frequency.value=1800; g.gain.value=vol;
    s.connect(f).connect(g).connect(out); s.start(t);
  }
  function hoot(t, out){   // "whooo!" from the crowd
    const o = ac.createOscillator(), v = ac.createOscillator(), vg = ac.createGain(), g = ac.createGain();
    const base = 520 + Math.random()*260;
    o.type='triangle'; o.frequency.setValueAtTime(base,t); o.frequency.linearRampToValueAtTime(base*1.5,t+.25); o.frequency.linearRampToValueAtTime(base*1.2,t+.7);
    v.frequency.value = 6; vg.gain.value = 14; v.connect(vg).connect(o.frequency);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.05,t+.08); g.gain.linearRampToValueAtTime(0,t+.7);
    o.connect(g).connect(out); o.start(t); v.start(t); o.stop(t+.72); v.stop(t+.72);
  }
  function drop(d, out){
    [[0,.18],[.24,.18],[.48,.75]].forEach(([s,len]) => {
      [233,349,466,470].forEach(f => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type='sawtooth'; o.frequency.value=f;
        g.gain.setValueAtTime(0,d+s); g.gain.linearRampToValueAtTime(.12,d+s+.02); g.gain.setValueAtTime(.12,d+s+len-.05); g.gain.linearRampToValueAtTime(0,d+s+len);
        o.connect(g).connect(out); o.start(d+s); o.stop(d+s+len+.02);
      });
    });
    const b = ac.createOscillator(), bg = ac.createGain();
    b.type='sine'; b.frequency.setValueAtTime(90,d); b.frequency.exponentialRampToValueAtTime(30,d+.8);
    bg.gain.setValueAtTime(1.2,d); bg.gain.exponentialRampToValueAtTime(.001,d+1);
    b.connect(bg).connect(out); b.start(d); b.stop(d+1.05);
    const n = ac.createBufferSource(), hp = ac.createBiquadFilter(), ng = ac.createGain();
    n.buffer = noiseBuf(1.2, 3); hp.type='highpass'; hp.frequency.value=3000; ng.gain.value=.35;
    n.connect(hp).connect(ng).connect(out); n.start(d);
  }

  function partySound(){
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); const t0 = ac.currentTime + .05;
    const master = ac.createGain(); master.gain.value = .55; master.connect(ac.destination);
    // 1) 28 dhoom-dhoom kicks
    BEATS.forEach(s => kick(t0+s, master));
    // 2) claps join after 8 beats, getting louder
    BEATS.slice(8).forEach((s,i) => clap(t0+s+BEAT/2, master, .3 + i*.015));
    // 3) stadium crowd roar: filtered noise that swells, plus random "whooo" hoots
    const crowd = ac.createBufferSource(), cf = ac.createBiquadFilter(), cg = ac.createGain();
    const cb = ac.createBuffer(1, ac.sampleRate*(END+1), ac.sampleRate), cd = cb.getChannelData(0);
    for (let i=0;i<cd.length;i++) cd[i] = Math.random()*2-1;
    crowd.buffer = cb; cf.type='bandpass'; cf.frequency.value=900; cf.Q.value=.6;
    cg.gain.setValueAtTime(0,t0); cg.gain.linearRampToValueAtTime(.05,t0+3); cg.gain.linearRampToValueAtTime(.14,t0+DROPS[0]);
    cg.gain.setValueAtTime(.18,t0+DROPS[0]); cg.gain.linearRampToValueAtTime(0,t0+END);
    crowd.connect(cf).connect(cg).connect(master); crowd.start(t0); crowd.stop(t0+END);
    for (let t=3; t<END-1; t+= .5 + Math.random()*.9) hoot(t0+t, master);
    // 4) longer build-up: rising synth + snare roll that speeds up
    const r = ac.createOscillator(), rf = ac.createBiquadFilter(), rg = ac.createGain(), D = DROPS[0];
    r.type='sawtooth'; r.frequency.setValueAtTime(150,t0+BUILD_START); r.frequency.exponentialRampToValueAtTime(1600,t0+D-.05);
    rf.type='lowpass'; rf.frequency.setValueAtTime(300,t0+BUILD_START); rf.frequency.exponentialRampToValueAtTime(7000,t0+D-.05);
    rg.gain.setValueAtTime(.001,t0+BUILD_START); rg.gain.exponentialRampToValueAtTime(.25,t0+D-.1); rg.gain.linearRampToValueAtTime(0,t0+D);
    r.connect(rf).connect(rg).connect(master); r.start(t0+BUILD_START); r.stop(t0+D+.05);
    for (let t=BEATS[27]+BEAT, gap=.24; t < D-.06; t += gap, gap = Math.max(.05, gap*.88)) snare(t0+t, master, .25 + (t-BEATS[27])*.06);
    // 5) three drops
    DROPS.forEach(d => drop(t0+d, master));
  }

  function confetti(at){
    const cols = ['#FF4F9A','#FFB547','#3DE8FF','#ffffff','#A78BFA','#4ADE80'];
    later(at, () => {
      for (let i=0;i<70;i++){
        const c = document.createElement('div'); c.className='confetti';
        c.style.left = Math.random()*100+'vw';
        c.style.background = cols[i%cols.length];
        c.style.borderRadius = Math.random()<.4 ? '50%' : '2px';
        c.style.setProperty('--dx', (Math.random()*160-80)+'px');
        c.style.setProperty('--r', (Math.random()*1080)+'deg');
        c.style.animationDuration = (1.6+Math.random()*1.6)+'s';
        c.style.animationDelay = (Math.random()*.4)+'s';
        document.body.appendChild(c); setTimeout(()=>c.remove(), 4000);
      }
    });
  }

  // background blinks in party colours (always under 3 flashes per second: safe for photosensitive users)
  function blink(){
    const cols = ['#7A1048','#7A4A00','#06606E','#3B1F8F','#5E0B6B','#0B5E3A'];
    BEATS.forEach((s,i) => later(s, () => { splash.style.backgroundColor = cols[i % cols.length]; }));
    for (let t=DROPS[0], k=0; t<END-.3; t+=.36, k++) later(t, () => { splash.style.backgroundColor = cols[(k*2+1) % cols.length]; });
  }

  function dropHit(at){
    later(at, () => {
      const big = splash.querySelector('.big'), fl = document.getElementById('flash');
      if (fl.animate) {
        fl.animate([{opacity:.85},{opacity:0}], {duration:450});
        splash.animate([{transform:'translate(0,0)'},{transform:'translate(-8px,4px)'},{transform:'translate(8px,-4px)'},{transform:'translate(-5px,2px)'},{transform:'translate(0,0)'}], {duration:500});
        big.animate([{transform:'scale(2.2)'},{transform:'scale(1)'}], {duration:500, easing:'cubic-bezier(.2,1.6,.4,1)'});
      }
      document.getElementById('onair').style.opacity = 1;
    });
    confetti(at);
  }

  // ----- the dancing Z: bar length follows the beat -----
  const zp = document.getElementById('zpath');
  let startT = null; const idle0 = performance.now();
  function zPath(e){          // e = how far the bars stick out
    const T=58, th=24, B=196, xl=250, xr=352, dx=34;
    return `M${xl-e} ${T} H${xr} V${T+th} L${xl+dx} ${B-th} H${xr+e} V${B} H${xl} V${B-th} L${xr-dx} ${T+th} H${xl-e} Z`;
  }
  // Z dance = two moves: bars stretch on the beat, and the whole Z spins
  //   - every 4th beat: one quick full spin (bars pulled in while spinning)
  //   - build-up: spins faster and faster, then lands upright exactly on the drop
  //   - drops: bars shoot out longest
  const CX = 301, CY = 127, SPIN = .4;
  const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
  function zState(now){
    const base = 40;
    if (startT === null) { const ph = ((now-idle0)/1000) % (BEAT*2); return { e: base + 70*Math.exp(-ph/.18), a: 0 }; }
    const t = (now-startT)/1000, lastBeat = BEATS[BEATS.length-1], bs = lastBeat + BEAT;
    if (t >= bs && t < DROPS[0]) {                      // build-up: accelerating spin
      const p = (t-bs)/(DROPS[0]-bs);
      return { e: 10, a: 2160*p*p };
    }
    for (let i=4; i<BEATS.length; i+=4) {               // quick spin on every 4th beat
      const b = BEATS[i];
      if (t >= b && t < b+SPIN) return { e: 0, a: 360*ease((t-b)/SPIN) };
    }
    let ev = -9, amp = 120;
    BEATS.forEach(b => { if (b <= t) { ev = b; amp = 120; } });
    for (let d=DROPS[0]; d<=t && d<END; d+=.36) { ev = d; amp = 150; }
    DROPS.forEach(d => { if (d <= t && t-d < .3) { ev = d; amp = 200; } });
    for (const d of DROPS.slice(0,2)) {                 // a spin between the drops too
      const s0 = d + .95; if (t >= s0 && t < s0+SPIN) return { e: 0, a: -360*ease((t-s0)/SPIN) };
    }
    return { e: base + amp*Math.exp(-(t-ev)/.16), a: 0 };
  }
  (function frame(now){
    if (!document.body.contains(splash)) return;
    const z = zState(now);
    zp.setAttribute('d', zPath(Math.max(0, z.e)));
    zp.setAttribute('transform', `rotate(${(z.a % 360).toFixed(2)} ${CX} ${CY})`);
    requestAnimationFrame(frame);
  })(performance.now());

  function close(){
    timers.forEach(clearTimeout); timers = [];
    if (ac) { try{ ac.close(); }catch(e){} ac = null; }
    splash.classList.add('out'); setTimeout(()=>splash.remove(), 600);
  }

  document.getElementById('goParty').onclick = () => {
    houzpaSetMuted(false);
    try { partySound(); } catch(e){}
    if (navigator.vibrate) navigator.vibrate(BEATS.flatMap(() => [60, BEAT*1000-60]).concat([0, (DROPS[0]-BEATS.length*BEAT)*1000, 400, 1300, 400, 1300, 600]));
    blink();
    splash.classList.add('on'); startT = performance.now();
    document.getElementById('goParty').style.display = 'none';
    const sk = document.getElementById('skip'); sk.textContent = 'Skip ⏭'; sk.onclick = close;
    DROPS.forEach(dropHit);
    later(END, close);
  };
  document.getElementById('skip').onclick = () => { houzpaSetMuted(true); close(); };
  window.houzpaPartySound = () => { try{ partySound(); }catch(e){} };
})();
</script>

        <div class="pfoot"><span>${esc(time)} · ${alc ? '<em class="alc">Licensed 21+</em>' : 'No alcohol'}</span>
          <span class="from">${prices.length ? 'From <b>₹' + Math.min(...prices) + '</b>' : ''}</span></div>
      </article>`;
    };
    const soon = list.filter(p => new Date(p.starts_at) - new Date() < 7 * 864e5);
    feed.innerHTML = (soon.length ? `<h2 class="sec">🔥 Is hafte</h2><div class="carousel">${soon.map((p, i) => card(p, i, true)).join('')}</div>` : '')
      + `<h2 class="sec">Sab parties <span class="count">${list.length}</span></h2>${list.map((p, i) => card(p, i)).join('')}`;
  };
  const test = {
    'Sab': () => true,
    'Aaj raat': p => new Date(p.starts_at).toDateString() === new Date().toDateString(),
    'Weekend': p => [0, 5, 6].includes(new Date(p.starts_at).getDay()),
    'Rooftop': p => p.venue_type === 'Rooftop',
    'Pool': p => p.has_pool,
    'Live music': p => (p.music || []).includes('Live music'),
    '₹800 se kam': p => (p.ticket_tiers || []).some(t => t.price_inr < 800)
  };
  document.getElementById('filters').onclick = e => {
    const b = e.target.closest('.fchip'); if (!b) return;
    document.querySelectorAll('.fchip').forEach(x => x.classList.toggle('on', x === b));
    draw(data.filter(test[b.textContent]));
  };
  draw(data);
}

// ---------- 4. PARTY BANAO (host) ----------
const VENUES = ['Rooftop', 'Apartment', 'Villa', 'Farmhouse', 'Garden', 'Pool property', 'Private lounge'];
const MUSIC = ['DJ', 'Live music', 'Bollywood', 'Punjabi', 'EDM', 'Sufi', 'Karaoke', 'Board games', 'Bonfire', 'Movie night'];
const FOOD = ['Veg', 'Non-veg', 'Snacks', 'Buffet', 'Barbecue', 'Desserts', 'Mocktails', 'Soft drinks'];
const RULES = ['No smoking indoors', 'Photos sirf consent se', 'Smart casual', 'No outside food', 'Pets on premises', 'ID check at gate', 'Society NOC le liya hai'];

// Safe capacity: sabse chhoti limit jeetegi. Kabhi bhi legal/fire limit se upar nahi.
function capacity(c) {
  const space = Math.floor(c.indoor / 15 + c.outdoor / 12);   // aaraam se khade hone ki jagah
  const wash = c.wash * 25;                                      // ~25 guests per washroom
  const exits = c.exits >= 2 ? Infinity : 50;                    // ek hi exit = chhoti party
  const park = Math.floor(c.cars * 2.5 + c.bikes * 1.5) + (c.transit ? Math.round(space * 0.4) : 0);
  const lims = [['Jagah (sq ft)', space], ['Washrooms', wash], ['Emergency exits', exits], ['Parking aur transport', park]];
  const min = lims.reduce((a, b) => (b[1] < a[1] ? b : a));
  return { lims, rec: Math.max(0, min[1] === Infinity ? 0 : min[1]), by: min[0] };
}

function viewCreate(profile) {
  const s = {
    venue: 'Rooftop', music: ['DJ'], food: ['Veg', 'Snacks'], rules: ['No smoking indoors', 'Photos sirf consent se'],
    vis: 'public', tiers: [{ name: 'Standard', price: 799, qty: 20 }],
    cap: { indoor: 600, outdoor: 1200, wash: 2, exits: 1, cars: 5, bikes: 8, transit: true }
  };
  const today = new Date(Date.now() + 864e5).toISOString().slice(0, 10);
  const picks = (key, opts, single) => `<div class="chips" data-key="${key}" data-single="${single ? 1 : ''}">${opts.map(o =>
    `<button type="button" class="pick ${(single ? s[key] === o : s[key].includes(o)) ? 'on' : ''}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  const num = (k, lbl) => `<div><label for="c_${k}">${lbl}</label><input id="c_${k}" type="number" min="0" value="${s.cap[k]}" inputmode="numeric"></div>`;

  app.innerHTML = frame('new', profile, `
    <h2>Party banao 🎉</h2>
    <form id="f" style="display:flex;flex-direction:column;gap:14px">
      <section class="card">
        <h3>1 · Party ki basic baatein</h3>
        <label for="nm">Party ka naam</label><input id="nm" required minlength="3" maxlength="80" placeholder="Jaise: Neon Rooftop Bollywood Night">
        <label for="ds">Description</label><textarea id="ds" maxlength="800" placeholder="Party mein kya khaas hai?"></textarea>
        <div class="grid2">
          <div><label for="ct">Shehar</label><input id="ct" required value="${esc(profile.city || 'Lucknow')}"></div>
          <div><label for="ar">Area (sabko dikhega)</label><input id="ar" required placeholder="Gomti Nagar"></div>
        </div>
        <div class="grid2">
          <div><label for="dt">Date</label><input id="dt" type="date" required min="${today}" value="${today}"></div>
          <div><label for="ag">Min age</label><select id="ag"><option>18</option><option>21</option><option>25</option></select></div>
        </div>
        <div class="grid2">
          <div><label for="st">Shuru</label><input id="st" type="time" required value="19:00"></div>
          <div><label for="en">Khatam</label><input id="en" type="time" required value="23:00"></div>
        </div>
        <label>Kaun dekh sakta hai</label>
        ${picks('vis', ['public', 'private', 'secret'], true)}
      </section>

      <section class="card">
        <h3>2 · Venue aur parking</h3>
        <label>Venue type</label>${picks('venue', VENUES, true)}
        <div class="grid2">${num('indoor', 'Indoor area (sq ft)')}${num('outdoor', 'Outdoor area (sq ft)')}${num('wash', 'Washrooms')}${num('exits', 'Exits / seedhiyan')}${num('cars', 'Car parking')}${num('bikes', '2-wheeler parking')}</div>
        <label class="check"><input id="c_transit" type="checkbox" ${s.cap.transit ? 'checked' : ''}> Cab drop-off ya metro paas mein hai</label>
        <div id="capbox"></div>
      </section>

      <section class="card">
        <h3>3 · Khana, music aur rules</h3>
        <label>Khana aur drinks</label>${picks('food', FOOD)}
        <label>Music aur entertainment</label>${picks('music', MUSIC)}
        <label for="vol">Music volume rule</label>
        <select id="vol"><option>Low / acoustic</option><option selected>Moderate (raat 10 baje tak)</option><option>Loud (sirf licensed venue)</option></select>
        <label>Alcohol</label>
        <div class="chips"><button type="button" class="pick on">No alcohol</button><button type="button" class="pick" disabled>Licensed bar (licence upload jald aa raha hai)</button></div>
        <label>House rules</label>${picks('rules', RULES)}
      </section>

      <section class="card">
        <h3>4 · Passes aur kamai</h3>
        <p class="small">Naam · Price ₹ · Kitne passes</p>
        <div id="tiers" style="display:flex;flex-direction:column;gap:8px"></div>
        <div class="chips">
          <button type="button" class="pick" data-add="VIP|1999|5">+ VIP</button>
          <button type="button" class="pick" data-add="Couple|1399|5">+ Couple</button>
          <button type="button" class="pick" data-add="Early-bird|599|10">+ Early-bird</button>
        </div>
        <div id="earn"></div>
      </section>

      <section class="card">
        <h3>5 · Exact address (private) 🔒</h3>
        <p class="small">Ye sirf un guests ko dikhega jinki payment confirm ho chuki hai.</p>
        <label for="ad">Poora address</label><textarea id="ad" required minlength="10" placeholder="Makaan no., gali, landmark"></textarea>
        <label for="ei">Entry instructions</label><input id="ei" placeholder="Jaise: Gate 2, lift se 5th floor">
        <label for="ph">Aapka phone (guests ke liye)</label><input id="ph" type="tel" required pattern="[0-9+ ]{10,15}" placeholder="98xxxxxxxx">
      </section>

      <section class="card">
        <label class="check"><input id="decl" type="checkbox" required> Main confirm karti/karta hoon ki ye property meri hai ya mujhe use karne ki permission hai, aur party local noise, society aur alcohol rules follow karegi. Party ko legally chalana meri zimmedari hai.</label>
        <button class="btn" id="go" type="submit">Approval ke liye bhejo 🚀</button>

  bindNav(profile);

  const $ = id => document.getElementById(id);

  // chips
  app.querySelectorAll('.chips[data-key]').forEach(box => {
    box.onclick = e => {
      const b = e.target.closest('.pick'); if (!b) return;
      const key = box.dataset.key, v = b.dataset.v;
      if (box.dataset.single) { s[key] = v; box.querySelectorAll('.pick').forEach(x => x.classList.toggle('on', x === b)); }
      else { const i = s[key].indexOf(v); i > -1 ? s[key].splice(i, 1) : s[key].push(v); b.classList.toggle('on'); }
    };
  });

  // capacity
  const totalPasses = () => s.tiers.reduce((a, t) => a + (t.qty || 0), 0);
  function drawCap() {
    const c = capacity(s.cap);
    $('capbox').innerHTML = `<div style="margin-top:4px">${c.lims.map(([n, v]) =>
      `<div class="kv"><span>${n}</span><b style="color:${n === c.by ? 'var(--warn)' : 'inherit'}">${v === Infinity ? 'Koi limit nahi' : v + ' guests'}</b></div>`).join('')}</div>
      <div class="okbox">Safe max: <b style="font-size:18px">${c.rec} guests</b><br>Limit ki wajah: <b>${c.by}</b>${c.by === 'Parking aur transport' ? `. ${s.cap.cars} car spaces itne guests ke liye kaafi nahi. Cab drop-off on karo.` : ''}</div>
      <p class="small">Ye sirf guidance hai. Legal occupancy aur fire-safety limit hamesha upar hai.</p>`;
    drawEarn();
  }
  ['indoor', 'outdoor', 'wash', 'exits', 'cars', 'bikes'].forEach(k => { $('c_' + k).oninput = e => { s.cap[k] = Math.max(0, +e.target.value || 0); drawCap(); }; });
  $('c_transit').onchange = e => { s.cap.transit = e.target.checked; drawCap(); };

  // tiers + earnings
  function drawTiers() {
    $('tiers').innerHTML = s.tiers.map((t, i) => `<div class="tier">
      <input data-i="${i}" data-f="name" value="${esc(t.name)}" maxlength="30" aria-label="Pass ka naam">
      <input data-i="${i}" data-f="price" type="number" min="0" value="${t.price}" inputmode="numeric" aria-label="Price">
      <input data-i="${i}" data-f="qty" type="number" min="1" value="${t.qty}" inputmode="numeric" aria-label="Passes">
      ${s.tiers.length > 1 ? `<button type="button" class="x" data-del="${i}" aria-label="Hatao">×</button>` : '<span></span>'}
    </div>`).join('');
    drawEarn();
  }
  $('tiers').oninput = e => {
    const el = e.target, t = s.tiers[el.dataset.i]; if (!t) return;
    t[el.dataset.f] = el.dataset.f === 'name' ? el.value : Math.max(0, +el.value || 0);
    drawEarn();
  };
  $('tiers').onclick = e => { const d = e.target.dataset.del; if (d !== undefined) { s.tiers.splice(+d, 1); drawTiers(); } };
  app.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
    const [name, price, qty] = b.dataset.add.split('|'); s.tiers.push({ name, price: +price, qty: +qty }); drawTiers();
  });
  function drawEarn() {
    const gross = s.tiers.reduce((a, t) => a + t.price * t.qty, 0);
    const com = gross * 0.10, pg = gross * 0.0236, net = gross - com - pg;
    const rs = n => '₹' + Math.round(n).toLocaleString('en-IN');
    const tq = totalPasses(), rec = capacity(s.cap).rec;
    $('earn').innerHTML = `<div class="kv"><span>Sab passes bike to (${tq})</span><b>${rs(gross)}</b></div>
      <div class="kv"><span>HOUZPA commission (10%)</span><b>− ${rs(com)}</b></div>
      <div class="kv"><span>Payment gateway (~2.36%)</span><b>− ${rs(pg)}</b></div>
      <div class="kv"><span>Aapki kamai</span><b class="price" style="font-size:18px">${rs(net)}</b></div>
      ${tq > rec ? `<div class="banner" style="margin:6px 0 0">${tq} passes safe capacity (${rec}) se zyada hain. Passes kam karo.</div>` : ''}`;
  }

  // submit
  $('f').onsubmit = async e => {
    e.preventDefault();
    const msg = $('msg'), btn = $('go');
    const fail = t => { msg.className = 'msg err'; msg.textContent = t; btn.disabled = false; };
    const c = capacity(s.cap), tq = totalPasses();
    if (!s.tiers.length || s.tiers.some(t => !t.name.trim() || t.qty < 1)) return fail('Har pass ka naam aur kam se kam 1 pass zaroori hai.');
    if (c.rec < 1) return fail('Venue details se safe capacity 0 aa rahi hai. Area aur washrooms check karo.');
    if (tq > c.rec) return fail(`Passes (${tq}) safe capacity (${c.rec}) se zyada hain.`);
    const date = $('dt').value, start = new Date(`${date}T${$('st').value}`);
    let end = new Date(`${date}T${$('en').value}`);
    if (end <= start) end = new Date(end.getTime() + 864e5);          // raat 12 ke baad khatam
    if (start <= new Date()) return fail('Party ka time future mein hona chahiye.');

    btn.disabled = true; msg.className = 'msg'; msg.textContent = 'Bhej rahe hain…';
    const { data: party, error } = await sb.from('parties').insert({
      host_id: session.user.id, name: $('nm').value.trim(), description: $('ds').value.trim() || null,
      city: $('ct').value.trim(), area: $('ar').value.trim(), venue_type: s.venue,
      starts_at: start.toISOString(), ends_at: end.toISOString(), min_age: +$('ag').value,
      safe_capacity: c.rec, music: s.music, food: s.food, alcohol: 'No alcohol', volume_rule: $('vol').value,
      house_rules: s.rules, parking_cars: s.cap.cars, parking_bikes: s.cap.bikes, has_pool: s.venue === 'Pool property',
      visibility: s.vis, status: 'pending_review', host_declared_lawful: true
    }).select('id').single();
    if (error) return fail('Error: ' + error.message);

    const r1 = await sb.from('ticket_tiers').insert(s.tiers.map(t => ({ party_id: party.id, name: t.name.trim(), price_inr: t.price, quantity: t.qty })));
    const r2 = await sb.from('party_private').insert({ party_id: party.id, exact_address: $('ad').value.trim(), entry_instructions: $('ei').value.trim() || null, host_phone: $('ph').value.trim() });
    if (r1.error || r2.error) {
      await sb.from('parties').update({ status: 'draft' }).eq('id', party.id);   // adhoori party approval mein na jaye
      return fail('Party save hui par passes/address mein error: ' + (r1.error || r2.error).message + '. Meri parties mein draft bani hai.');
    }
    if (!profile.is_host) await sb.from('profiles').update({ is_host: true }).eq('id', session.user.id);
    viewMine(profile, 'Party approval ke liye chali gayi! 🎉 Admin approve karte hi sabko dikhegi.');
  };

  drawCap(); drawTiers();
}

const STATUS = { draft: 'Draft', pending_review: 'Approval baaki', published: 'Live ✓', cancelled: 'Rejected / cancelled', completed: 'Ho gayi' };
const when = d => new Date(d).toLocaleString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });

async function viewMine(profile, note = '') {
  app.innerHTML = frame('mine', profile, `
    ${note ? `<div class="okbox" style="margin-bottom:14px">${esc(note)}</div>` : ''}
    <h2>Meri parties</h2><div id="list"><p class="empty">Load ho raha hai…</p></div>
  `);
  bindNav(profile);
  const { data, error } = await sb.from('parties')
    .select('id,name,area,city,starts_at,status,safe_capacity,ticket_tiers(name,price_inr,quantity,sold)')
    .eq('host_id', session.user.id).order('starts_at', { ascending: false });

  if (error) { list.innerHTML = `<p class="empty err">Error: ${esc(error.message)}</p>`; return; }

  list.innerHTML = data.map(p => {
    const sold = p.ticket_tiers.reduce((a, t) => a + t.sold, 0), total = p.ticket_tiers.reduce((a, t) => a + t.quantity, 0);
    return `<article class="party"><div class="body">
      <div class="row"><h3>${esc(p.name)}</h3><span class="status st-${p.status}">${STATUS[p.status] || p.status}</span></div>
      <p class="small">${esc(p.area)}, ${esc(p.city)} · ${esc(when(p.starts_at))}</p>
      <p class="small">Passes: ${sold} / ${total} bike · Safe max ${p.safe_capacity}</p>
    </div></article>`;
  }).join('');
}

// ---------- 6. ADMIN: parties approve karo ----------
async function viewAdmin(profile) {
  if (!profile.is_admin) return viewHome(profile);
  app.innerHTML = frame('admin', profile, `
    <h2>Admin · Approval ke liye parties</h2><p class="msg" id="msg"></p><div id="list"><p class="empty">Load ho raha hai…</p></div>
  `);
  bindNav(profile);
  const { data, error } = await sb.from('parties')
    .select('id,name,description,area,city,venue_type,starts_at,ends_at,min_age,safe_capacity,music,food,house_rules,visibility,host:profiles!parties_host_id_fkey(full_name,is_verified),ticket_tiers(name,price_inr,quantity),party_private(exact_address,host_phone)')
    .eq('status', 'pending_review').order('starts_at');
  const list = document.getElementById('list');
  if (error) { list.innerHTML = `<p class="empty err">Error: ${esc(error.message)}</p>`; return; }
  if (!data.length) { list.innerHTML = '<p class="empty">Koi party approval ke liye pending nahi hai. ✅</p>'; return; }
  list.innerHTML = data.map(p => {
    const priv = Array.isArray(p.party_private) ? p.party_private[0] : p.party_private;
    return `<article class="card" style="margin-bottom:12px">
      <h3>${esc(p.name)}</h3>
      <p class="small">Host: ${esc(p.host?.full_name)} ${p.host?.is_verified ? '✓ verified' : '⚠ unverified'} · ${esc(p.visibility)}</p>
      <p class="small">${esc(when(p.starts_at))} – ${esc(new Date(p.ends_at).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }))} · ${esc(p.venue_type)} · ${p.min_age}+</p>
      ${p.description ? `<p style="font-size:14px">${esc(p.description)}</p>` : ''}
      <div class="kv"><span>Safe capacity</span><b>${p.safe_capacity}</b></div>
      <div class="kv"><span>Passes</span><b>${p.ticket_tiers.map(t => `${esc(t.name)} ₹${t.price_inr}×${t.quantity}`).join(', ')}</b></div>
      <div class="kv"><span>Music / food</span><b>${esc([...p.music, ...p.food].join(', '))}</b></div>
      <div class="kv"><span>Rules</span><b>${esc(p.house_rules.join(', '))}</b></div>
      <div class="kv"><span>Address 🔒</span><b>${esc(priv?.exact_address || '—')}, ${esc(p.area)}, ${esc(p.city)}</b></div>
      <div class="kv"><span>Host phone</span><b>${esc(priv?.host_phone || '—')}</b></div>
      <div class="grid2"><button class="btn" data-pub="${p.id}" type="button">Approve ✓</button><button class="btn ghost" data-rej="${p.id}" type="button">Reject</button></div>
    </article>`;
  }).join('');
  list.onclick = async e => {
    const id = e.target.dataset.pub || e.target.dataset.rej; if (!id) return;
    e.target.disabled = true;
    const { error } = await sb.from('parties').update({ status: e.target.dataset.pub ? 'published' : 'cancelled' }).eq('id', id);
    const msg = document.getElementById('msg');
    if (error) { msg.className = 'msg err'; msg.textContent = 'Error: ' + error.message; e.target.disabled = false; return; }
    msg.className = 'msg'; msg.textContent = e.target.dataset.pub ? 'Party live ho gayi! 🎉' : 'Party reject kar di.';
    e.target.closest('article').remove();
  };
}

// ---------- ROUTER ----------
async function route() {
  if (!session) return viewLogin();
  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if (error) { app.innerHTML = `<main class="center">${logo()}<p class="msg err">Error: ${esc(error.message)}</p></main>`; return; }
  if (!profile) return viewProfile();
  viewHome(profile);
}

sb.auth.onAuthStateChange((_event, s) => { session = s; setTimeout(route, 0); });
